name: 🕌 Haftanın Hutbesi Ajanı

on:
  schedule:
    # Türkiye saatiyle Cuma sabahı 08:00'da çalışır (UTC saatiyle 05:00)
    - cron: '0 5 * * 5'
  
  workflow_dispatch: 

jobs:
  ajan_gorevi:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: 📥 Repoyu Sunucuya Çek
        uses: actions/checkout@v4
        with:
          ref: main
          # Geçmişi tam indirme garantisi
          fetch-depth: 0 

      - name: 🐍 Python Motorunu Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Gerekli Cephaneyi (Kütüphaneleri) Yükle
        run: pip install requests

      - name: 🕵️‍♂️ Ajanı Serbest Bırak (Python Kodunu Çalıştır)
        run: python guncel_hutbe_bot.py

      # SENIOR DOKUNUŞU: Manuel Git Komutları Çöpe! Resmi Eklenti Devrede!
      - name: 🚀 Yeni Hutbeyi ve JSON'ı GitHub'a Gönder (Otomatik)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Otomatik Güncelleme: Yeni haftanın hutbesi arşive eklendi"
          branch: main
          commit_user_name: Hutbe-Bot
          commit_user_email: bot@islam365.com
