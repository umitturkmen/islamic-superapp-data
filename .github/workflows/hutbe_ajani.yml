name: 🕌 Haftanın Hutbesi Ajanı

on:
  schedule:
    # Türkiye saatiyle Cuma sabahı 08:00'da çalışır (UTC saatiyle 05:00)
    - cron: '0 5 * * 5'
  
  # GitHub üzerinden manuel "Run workflow" butonu ile çalıştırmaya izin verir
  workflow_dispatch: 

jobs:
  ajan_gorevi:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: 📥 Repoyu Sunucuya Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Olası çakışmaları önlemek için tüm geçmişi çeker

      - name: 🐍 Python Motorunu Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Gerekli Cephaneyi (Kütüphaneleri) Yükle
        run: pip install requests

      - name: 🕵️‍♂️ Ajanı Serbest Bırak (Python Kodunu Çalıştır)
        run: python guncel_hutbe_bot.py

      - name: 🚀 Yeni Hutbeyi ve JSON'ı GitHub'a Gönder (Push)
        run: |
          git config --global user.name "Hutbe-Bot"
          git config --global user.email "bot@islam365.com"
          git add .
          
          # SENIOR DOKUNUŞU: Klasörde gerçekten yeni bir dosya var mı kontrol et
          if git diff --staged --quiet; then
            echo "✅ Diyanet henüz yeni hutbeyi yüklememiş veya zaten güncel. Sistem uykuya dönüyor."
          else
            git commit -m "🤖 Otomatik Güncelleme: Yeni haftanın hutbesi arşive eklendi"
            git pull --rebase origin main
            # Kopuk kafa (Detached HEAD) sorununu kökten çözen o sihirli satır:
            git push origin HEAD:main
          fi